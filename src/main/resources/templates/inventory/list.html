<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory - Healio</title>
    <link href="/lib/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="/lib/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/sidebar :: sidebar(activePage='inventory')}"></div>
    <div class="main-content">
        <div th:replace="~{fragments/navbar :: navbar(pageTitle='Inventory')}"></div>

        <div class="page-header d-flex justify-content-between align-items-center flex-wrap gap-2">
            <h4 class="mb-0"><i class="bi bi-boxes me-2"></i>Inventory</h4>
            <div class="d-flex gap-2">
                <form method="get" action="/inventory" class="d-flex gap-2">
                    <input type="text" name="search" class="form-control" 
                           placeholder="Search products..." 
                           th:value="${search != null ? search : ''}"
                           style="width: 250px;">
                    <button type="submit" class="btn btn-outline-primary">
                        <i class="bi bi-search"></i>
                    </button>
                    <a th:href="@{/inventory}" class="btn btn-outline-secondary" th:if="${search != null}">
                        <i class="bi bi-x-circle"></i> Clear
                    </a>
                </form>
            </div>
        </div>

        <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
            <i class="bi bi-check-circle-fill me-2"></i><span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="content-card">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Product Name</th>
                            <th>Package</th>
                            <th>Category</th>
                            <th>Manufacturer</th>
                            <th>Strength</th>
                            <th class="text-center">Total Quantity</th>
                            <th class="text-center">Available</th>
                            <th class="text-center">Status</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="data : ${inventoryData}">
                            <td th:text="${data.product.id}"></td>
                            <td>
                                <strong th:text="${data.product.name}"></strong>
                                <br>
                                <small class="text-muted" th:if="${data.product.generic != null}" 
                                       th:text="${'Generic: ' + data.product.generic.name}"></small>
                            </td>
                            <td>
                                <span th:if="${data.productPackage != null}" 
                                      th:text="${data.productPackage.packageDescription}"></span>
                                <span th:if="${data.productPackage == null}" class="text-muted">No Package</span>
                                <br>
                                <small class="text-muted" th:if="${data.productPackage != null && data.productPackage.unitPrice != null}">
                                    <span th:text="${'৳' + #numbers.formatDecimal(data.productPackage.unitPrice, 1, 2)}"></span>
                                    <span th:if="${data.productPackage.unitOfMeasure != null && !data.productPackage.unitOfMeasure.isEmpty()}"
                                          th:text="${' / ' + data.productPackage.unitOfMeasure}"></span>
                                </small>
                            </td>
                            <td th:text="${data.product.productCategory?.name}"></td>
                            <td th:text="${data.product.manufacturer?.name}"></td>
                            <td th:text="${data.product.strength}"></td>
                            <td class="text-center">
                                <span class="badge bg-info" th:text="${data.totalQuantity}"></span>
                            </td>
                            <td class="text-center">
                                <span class="badge bg-success" th:text="${data.totalAvailable}"></span>
                            </td>
                            <td class="text-center">
                                <span th:if="${data.totalAvailable == 0}" class="badge bg-danger">Out of Stock</span>
                                <span th:if="${data.totalAvailable > 0 && data.isLowStock}" class="badge bg-warning">Low Stock</span>
                                <span th:if="${data.totalAvailable > 0 && !data.isLowStock}" class="badge bg-success">In Stock</span>
                            </td>
                            <td class="text-end">
                                <a th:href="@{/products/edit/{id}(id=${data.product.id})}" 
                                   class="btn btn-sm btn-warning" 
                                   title="Edit Product">
                                    <i class="bi bi-pencil"></i>
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${inventoryData.isEmpty()}">
                            <td colspan="10" class="text-center text-muted py-4">
                                <i class="bi bi-inbox" style="font-size: 2rem; opacity: 0.5;"></i>
                                <p class="mt-2 mb-0">No products found in inventory</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div th:if="${products.totalPages > 1}" class="mt-4">
                <nav aria-label="Page navigation">
                    <ul class="pagination justify-content-center mb-2">
                        <!-- Previous Button -->
                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                            <a class="page-link" 
                               th:href="@{/inventory(page=${currentPage > 0 ? currentPage - 1 : 0}, size=${pageSize}, search=${search})}"
                               th:if="${currentPage > 0}">
                                <i class="bi bi-chevron-left"></i> Previous
                            </a>
                            <span class="page-link" th:if="${currentPage == 0}" style="color: #6c757d; cursor: not-allowed; background-color: #f8f9fa;">
                                <i class="bi bi-chevron-left"></i> Previous
                            </span>
                        </li>
                        
                        <!-- Always show first page -->
                        <li class="page-item" th:classappend="${currentPage == 0} ? 'active'">
                            <a class="page-link" 
                               th:href="@{/inventory(page=0, size=${pageSize}, search=${search})}">1</a>
                        </li>
                        
                        <!-- Calculate which pages to show -->
                        <th:block th:with="
                            showEllipsisBefore=${currentPage > 4},
                            showEllipsisAfter=${currentPage < products.totalPages - 5},
                            startPage=${currentPage <= 4 ? 1 : (currentPage > products.totalPages - 5 ? (products.totalPages > 5 ? products.totalPages - 4 : 1) : currentPage - 2)},
                            endPage=${currentPage <= 4 ? (products.totalPages > 5 ? 5 : products.totalPages - 1) : (currentPage > products.totalPages - 5 ? products.totalPages - 2 : currentPage + 2)}">
                            
                            <!-- Show ellipsis before middle pages -->
                            <li class="page-item disabled" th:if="${showEllipsisBefore}">
                                <span class="page-link" style="background-color: #f8f9fa; color: #6c757d; border: none; cursor: default;">...</span>
                            </li>
                            
                            <!-- Show pages around current page -->
                            <li th:each="pageNum : ${#numbers.sequence(startPage, endPage)}" 
                                th:if="${pageNum > 0 && pageNum < products.totalPages - 1}"
                                class="page-item" 
                                th:classappend="${pageNum == currentPage} ? 'active'">
                                <a class="page-link" 
                                   th:href="@{/inventory(page=${pageNum}, size=${pageSize}, search=${search})}"
                                   th:text="${pageNum + 1}"></a>
                            </li>
                            
                            <!-- Show ellipsis after middle pages -->
                            <li class="page-item disabled" th:if="${showEllipsisAfter && products.totalPages > 6}">
                                <span class="page-link" style="background-color: #f8f9fa; color: #6c757d; border: none; cursor: default;">...</span>
                            </li>
                        </th:block>
                        
                        <!-- Always show last page (if more than 1 page) -->
                        <li class="page-item" 
                            th:if="${products.totalPages > 1}"
                            th:classappend="${currentPage == products.totalPages - 1} ? 'active'">
                            <a class="page-link" 
                               th:href="@{/inventory(page=${products.totalPages - 1}, size=${pageSize}, search=${search})}"
                               th:text="${products.totalPages}"></a>
                        </li>
                        
                        <!-- Next Button -->
                        <li class="page-item" th:classappend="${currentPage == products.totalPages - 1} ? 'disabled'">
                            <a class="page-link" 
                               th:href="@{/inventory(page=${currentPage < products.totalPages - 1 ? currentPage + 1 : products.totalPages - 1}, size=${pageSize}, search=${search})}"
                               th:if="${currentPage < products.totalPages - 1}">
                                Next <i class="bi bi-chevron-right"></i>
                            </a>
                            <span class="page-link" th:if="${currentPage == products.totalPages - 1}" style="color: #6c757d; cursor: not-allowed; background-color: #f8f9fa;">
                                Next <i class="bi bi-chevron-right"></i>
                            </span>
                        </li>
                    </ul>
                </nav>
                
                <!-- Showing X of Y text -->
                <div class="text-center text-muted mt-2">
                    <span th:text="'Showing ' + ${products.numberOfElements} + ' of ' + ${products.totalElements} + ' items'"></span>
                </div>
            </div>
        </div>
    </div>
    <script src="/lib/bootstrap/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/common.js}"></script>
</body>
</html>

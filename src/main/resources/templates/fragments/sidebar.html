<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="sidebar(activePage)" class="sidebar" id="sidebar">
        <div class="logo">
            <img src="/logo-slogan.png" alt="Healio" class="logo-expanded">
            <img src="/logo.png" alt="Healio" class="logo-collapsed">
        </div>
        <nav class="nav flex-column">
            <a class="nav-link" th:classappend="${activePage == 'dashboard'} ? 'active'" href="/dashboard">
                <i class="bi bi-speedometer2"></i><span>Dashboard</span>
            </a>
            <a class="nav-link" th:classappend="${activePage == 'products'} ? 'active'" href="/products">
                <i class="bi bi-capsule"></i><span>Products</span>
            </a>
            <a class="nav-link" th:classappend="${activePage == 'sales'} ? 'active'" href="/sales">
                <i class="bi bi-cart"></i><span>Sales</span>
            </a>
            <a class="nav-link" th:classappend="${activePage == 'stock-in'} ? 'active'" href="/stock-in">
                <i class="bi bi-box-arrow-in-down"></i><span>Stock In</span>
            </a>
            <a class="nav-link" th:classappend="${activePage == 'inventory'} ? 'active'" href="/inventory">
                <i class="bi bi-boxes"></i><span>Inventory</span>
            </a>
            <a class="nav-link" th:classappend="${activePage == 'customers'} ? 'active'" href="/customers">
                <i class="bi bi-people"></i><span>Customers</span>
            </a>
            <a class="nav-link" th:classappend="${activePage == 'suppliers'} ? 'active'" href="/suppliers">
                <i class="bi bi-truck"></i><span>Suppliers</span>
            </a>
            <a class="nav-link" th:classappend="${activePage == 'manufacturers'} ? 'active'" href="/manufacturers">
                <i class="bi bi-building"></i><span>Manufacturers</span>
            </a>
            <a class="nav-link" th:classappend="${activePage == 'users'} ? 'active'" href="/users">
                <i class="bi bi-person-gear"></i><span>Users</span>
            </a>
            <a class="nav-link" th:classappend="${activePage == 'import'} ? 'active'" href="/import/medicine">
                <i class="bi bi-upload"></i><span>Import Medicines</span>
            </a>
        </nav>
    </div>
</body>
</html>

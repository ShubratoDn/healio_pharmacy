<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <th:block th:fragment="head(title, description, keywords)">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        
        <!-- SEO Meta Tags -->
        <title th:text="${title} + ' - Healio Pharmacy Management System'">Healio Pharmacy Management</title>
        <meta name="description" th:content="${description ?: 'Healio Pharmacy Management System - Comprehensive solution for managing pharmacy operations, inventory, sales, and customer relationships.'}">
        <meta name="keywords" th:content="${keywords ?: 'pharmacy management, inventory management, pharmacy software, medicine management, sales management, pharmacy system'}">
        <meta name="author" content="Healio">
        <meta name="robots" content="index, follow">
        <meta name="language" content="English">
        
        <!-- Open Graph / Facebook -->
        <meta property="og:type" content="website">
        <meta property="og:title" th:content="${title} + ' - Healio Pharmacy Management System'">
        <meta property="og:description" th:content="${description ?: 'Healio Pharmacy Management System - Comprehensive solution for managing pharmacy operations'}">
        <meta property="og:site_name" content="Healio Pharmacy Management">
        
        <!-- Twitter -->
        <meta name="twitter:card" content="summary">
        <meta name="twitter:title" th:content="${title} + ' - Healio Pharmacy Management System'">
        <meta name="twitter:description" th:content="${description ?: 'Healio Pharmacy Management System - Comprehensive solution for managing pharmacy operations'}">
        
        <!-- Favicon -->
        <link rel="icon" type="image/png" href="/icon.png">
        <link rel="apple-touch-icon" href="/icon.png">
        
        <!-- Stylesheets -->
        <link href="/lib/bootstrap/bootstrap.min.css" rel="stylesheet">
        <link href="/lib/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </th:block>
</body>
</html>
